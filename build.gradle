plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.28-beta'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'Cell4-1.21.1-NeoForge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = "AE2 Maven"
        url = "https://modmaven.dev/"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        client {
            client()
        }

        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // AE2 (from Modrinth Maven — modmaven only has up to 19.2.0-beta)
    implementation "maven.modrinth:XxWD5pD3:${ae2_version}"
    // GuideME (from Modrinth Maven)
    implementation "maven.modrinth:Ck4E7v7R:${guideme_version}"
    // ae2wtlib (from modmaven — needed for CraftingTerminalHandlerMixin)
    compileOnly "de.mari_023:ae2wtlib:${ae2wtlib_version}"
    // Mekanism API (from modmaven)
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
}

jar {
    manifest {
        attributes(
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'Cell4',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'Cell4'
        )
    }
}
