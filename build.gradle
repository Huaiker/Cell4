plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
archivesBaseName = 'Cell4-1.20.1-Forge'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // modmaven (AE2, Mekanism)
    maven {
        name = "modmaven"
        url = "https://modmaven.dev/"
    }
    // Modrinth Maven (ae2wtlib — modmaven元数据错误标记为Java 21, 用Modrinth maven绕过)
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    // SpongePowered Maven (mixin annotation processor)
    maven {
        name = "SpongePowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // AE2
    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    // Mekanism API (from modmaven)
    compileOnly fg.deobf("mekanism:Mekanism:${mekanism_version}:api")
    // ae2wtlib (from Modrinth Maven — modmaven元数据有Java 21 bug)
    compileOnly "maven.modrinth:pNabrMMw:${ae2wtlib_version}"
    // Mixin annotation processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

configurations {
    annotationProcessor.extendsFrom compileOnly
}

jar {
    manifest {
        attributes(
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'Cell4',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'Cell4',
            'MixinConfigs'            : 'cell4.mixins.json'
        )
    }
}

jar.finalizedBy('reobfJar')
