modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="cell4"
version="${file.jarVersion}"
displayName="Cell\u2074 (NeoForge)"
authors="Huaiker"
description='''An AE2 addon adding Infinity Cells that support filtering by item, tag, and mod ID.'''
logoFile="cell4_logo.png"

# Mixin config — 将 KeyCounter 存储上限提升到 BigInteger
[[mixins]]
config="cell4.mixins.json"

[[dependencies.cell4]]
modId="neoforge"
type="required"
versionRange="[21.1.169,)"
ordering="NONE"
side="BOTH"

[[dependencies.cell4]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.22)"
ordering="NONE"
side="BOTH"

[[dependencies.cell4]]
modId="ae2"
type="required"
versionRange="[19.0.0,20.0.0)"
ordering="AFTER"
side="BOTH"

# ae2wtlib (可选 — 修复 restock overlay 显示 "0" 的问题)
[[dependencies.cell4]]
modId="ae2wtlib"
type="optional"
versionRange="[19.5.0,)"
ordering="AFTER"
side="BOTH"

# Optional Mekanism integration. When present (together with AppMek / Applied Mekanistics),
# Infinity Cells will also expose Mekanism chemicals (gas / infuse type / pigment / slurry).
# When absent, the integration is silently disabled and the mod still loads normally.
[[dependencies.cell4]]
modId="mekanism"
type="optional"
versionRange="[10.7.0,)"
ordering="AFTER"
side="BOTH"

# Optional AppMek (Applied Mekanistics) integration. Required for Mekanism chemical
# AEKeys to actually be produced; without it Mekanism chemicals are silently ignored.
[[dependencies.cell4]]
modId="appmek"
type="optional"
versionRange="[1.5.0,)"
ordering="AFTER"
side="BOTH"
