modLoader="javafml"
loaderVersion="[47,48)"
license="MIT"

[[mods]]
modId="cell4"
version="${file.jarVersion}"
displayName="Cell\u2074 (Forge)"
authors="Cell4"
description='''
An AE2 addon adding Infinity Cells that support filtering by item, tag, and mod ID.'''
logoFile="cell4_logo.png"

# Mixin config — 将 KeyCounter 存储上限提升到 BigInteger
[[mixins]]
config="cell4.mixins.json"

[[dependencies.cell4]]
modId="forge"
mandatory=true
versionRange="[47,48)"
ordering="NONE"
side="BOTH"

[[dependencies.cell4]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[dependencies.cell4]]
modId="ae2"
mandatory=true
versionRange="[15.0.0,16.0.0)"
ordering="AFTER"
side="BOTH"

# ae2wtlib (可选 — 修复 restock overlay 显示 "0" 的问题)
[[dependencies.cell4]]
modId="ae2wtlib"
mandatory=false
versionRange="[15.3.0,)"
ordering="AFTER"
side="BOTH"

# Optional Mekanism integration. When present (together with AppMek / Applied Mekanistics),
# Infinity Cells will also expose Mekanism chemicals (gas / infuse type / pigment / slurry).
# When absent, the integration is silently disabled and the mod still loads normally.
[[dependencies.cell4]]
modId="mekanism"
mandatory=false
versionRange="[10.4.0,)"
ordering="AFTER"
side="BOTH"

# Optional AppMek (Applied Mekanistics) integration. Required for Mekanism chemical
# AEKeys to actually be produced; without it Mekanism chemicals are silently ignored.
[[dependencies.cell4]]
modId="appmek"
mandatory=false
versionRange="[1.4.0,)"
ordering="AFTER"
side="BOTH"
